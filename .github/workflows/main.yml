name: Build EXE
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller==6.9.0

      - name: Debug - List root files
        run: dir
      - name: Debug - List images folder
        run: dir images

      - name: Build EXE
        run: pyinstaller keyboard_pet.py -F -w --hidden-import PyQt5.QtWidgets --hidden-import PyQt5.QtGui --hidden-import PyQt5.QtCore --add-data "images;images"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 桌面宠物可执行文件
          path: dist/*.exe
